

services:

# *** Gestión del wokflow ***
  n8n:
    build: ./n8n_container
    user: root
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_container/n8n_data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      - ./outputs:/root/.n8n-files
      - ./dashverse_runner:/opt/dashverse_runner:ro
      - ./scripts/backup_outputs.sh:/opt/scripts/backup_outputs.sh:ro
      - ./backups:/data/backups
    depends_on:
      - rabbitmq
    networks:
      - net
    group_add:
      - "998"
    environment:
      # *** Privadas ***
      - GITHUB_API_TOKEN=${GITHUB_API_TOKEN}
      - OUTPUTS=${OUTPUTS}
      - DASHBOARD_ORG_EMBED_ID=${DASHBOARD_ORG_EMBED_ID}
      - DASHBOARD_REPO_EMBED_ID=${DASHBOARD_REPO_EMBED_ID}
      - SUPERSET_PUBLIC_DOMAIN=${SUPERSET_PUBLIC_DOMAIN:-http://host.docker.internal:8088}
      - DASHVERSE_JWT=${DASHVERSE_JWT}
      - WIKIBASE_USER=${WIKIBASE_USER}
      - WIKIBASE_PASSWORD=${WIKIBASE_PASSWORD}
      # *** General ***
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
      - NODE_ENV=production
      # *** Settings ***
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_USER_FOLDER=/home/node/.n8n
      # *** RabbitMQ ***
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RATE_LIMIT_RSFC_ENABLED=${RATE_LIMIT_RSFC_ENABLED}
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
    - "5672:5672"
    - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password123
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
    - net

# *** SOCA ***
  worker_soca:
    image: soca-heavy
    command: python -u -m soca_runner.worker
    volumes:
      - ./outputs:/app/outputs
    networks:
      - net
    environment:
      - GITHUB_TOKEN=${GITHUB_API_TOKEN}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - DASHBOARD_ORG_EMBED_ID=${DASHBOARD_ORG_EMBED_ID}
      - DASHBOARD_REPO_EMBED_ID=${DASHBOARD_REPO_EMBED_ID}
      - SUPERSET_PUBLIC_DOMAIN=${SUPERSET_PUBLIC_DOMAIN:-http://host.docker.internal:8088}
    restart: unless-stopped


  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORTAL_PORT:-8030}:80"
    volumes:
      - ./outputs:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - net
    restart: unless-stopped
  
# *** RSFC ***

  worker_rsfc:
    image: rsfc-heavy
    command: python -u -m rsfc_runner.worker
    networks:
      - net
    volumes:
      - ./outputs:/app/outputs
    environment:
      - GITHUB_TOKEN=${GITHUB_API_TOKEN}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - OUTPUTS=/app/outputs
    restart: unless-stopped


  rate_limiter_rsfc:
    image: rsfc-heavy
    command: python -m rsfc_runner.rabbitmq.rate_limiter
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RATE_LIMIT_RSFC_ENABLED=${RATE_LIMIT_RSFC_ENABLED}

    networks:
      - net
    restart: unless-stopped


# ** RESQUI **

  worker_resqui:
    image: resqui-heavy
    command: python -u -m resqui_runner.worker
    depends_on:
      - rabbitmq
    networks:
      - net
    volumes:
      - ./outputs:/app/outputs
      - resqui_work:/resqui-work
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_API_TOKEN}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RESQUI_SHARED_WORKDIR=/resqui-work
      - RESQUI_DOCKER_WORK_VOLUME=sqoo_resqui_work
      - RATE_LIMIT_RESQUI_ENABLED=${RATE_LIMIT_RESQUI_ENABLED}
      - RESQUI_CONF=${RESQUI_CONF}

  rate_limiter_resqui:
    image: resqui-heavy
    command: python -m resqui_runner.rabbitmq.rate_limiter
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RATE_LIMIT_RESQUI_ENABLED=${RATE_LIMIT_RESQUI_ENABLED}
    restart: unless-stopped

    networks:
      - net



networks:
  net:
    driver: bridge

volumes:
  resqui_work:
    name: sqoo_resqui_work
