server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html/soca/oeg-lincedu-morph-widoco/portal;
    index index.html;

    # Portal SOCA principal
    location = / {
        try_files /index.html =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Portal LinkedData
    location = /linkeddata {
        return 301 /linkeddata/;
    }

    location ^~ /linkeddata/ {
        alias /usr/share/nginx/html/linkeddata_portal/generates/;
        index index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Bloquear rutas antiguas /portals y /portals/...
    location = /portals {
        return 404;
    }

    location ^~ /portals/ {
        return 404;
    }

    # Bloquear /soca y /soca/..., pero permitir /soca-card.css
    location = /soca {
        return 404;
    }

    location ^~ /soca/ {
        return 404;
    }

    # Bloquear /linkeddata_portal y /linkeddata_portal/...
    location = /linkeddata_portal {
        return 404;
    }

    location ^~ /linkeddata_portal/ {
        return 404;
    }

    # Recursos del portal principal
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Bloquear archivos ocultos
    location ~ /\. {
        deny all;
    }
}